
name: Prepare Mandatos Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking Mandatos project..."
          test -f CMakeLists.txt
          test -f src/main.c
          test -f src/seats.c
          test -f assets-cg/icon-uns.png
          test -f assets-cg/icon-sel.png
          echo "Project files are present."

      - name: Check GitHub-only dependency sources
        run: |
          git ls-remote https://github.com/lephe/Fx-SDK.git HEAD
          git ls-remote https://github.com/Insoft-UK/gint.git HEAD

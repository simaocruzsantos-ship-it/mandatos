name: Compilar Mandatos.g3a

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git curl unzip python3 python3-pip pipx \
            pkg-config libusb-1.0-0-dev libudev-dev libpng-dev libsdl2-dev libfreetype6-dev \
            libgmp-dev libmpfr-dev libmpc-dev libppl-dev flex texinfo

      - name: Cache da toolchain
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: fxsdk-toolchain-v1

      - name: Instalar GiteaPC
        if: steps.cache-tc.outputs.cache-hit != 'true'
        run: |
          pipx install giteapc
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compilador sh-elf-gcc (demora, so na primeira vez)
        if: steps.cache-tc.outputs.cache-hit != 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          giteapc install -y Lephenixnoir/sh-elf-gcc

      - name: fxSDK e gint
        if: steps.cache-tc.outputs.cache-hit != 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          giteapc install -y Lephenixnoir/fxsdk Lephenixnoir/OpenLibm Lephenixnoir/gint

      - name: Compilar
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          fxsdk build-cg

      - name: Guardar o .g3a
        uses: actions/upload-artifact@v4
        with:
          name: Mandatos-g3a
          path: build-cg/*.g3a

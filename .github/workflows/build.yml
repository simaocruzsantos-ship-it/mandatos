
name: Build Mandatos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test logic
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Compile tests
        run: gcc -Wall -Wextra -Isrc test/t.c src/seats.c -o t_seats

      - name: Run tests
        run: ./t_seats
